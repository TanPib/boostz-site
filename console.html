<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boostz — console</title>
<!-- Jamais indexée. Cette page est publique au sens où GitHub Pages sert tout
     ce qu'il héberge, mais elle n'a rien à faire dans un moteur de recherche :
     ce qu'on y voit vient de l'API, et l'API ne répond qu'à un compte admin.
     Le noindex ne protège donc rien - il évite juste de mettre une porte en
     vitrine. -->
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="style.css">
<style>
  /* Aucune ressource externe, comme le reste du site : ni police distante, ni
     CDN, ni traceur. La politique de confidentialité affirme que ce site
     n'appelle aucun tiers, et une console qui chargerait une bibliothèque
     contredirait le texte publié à côté d'elle. */
  .page { max-width: 1100px; }
  .barre { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 18px 0; }
  input, button, select { font: inherit; }
  input { padding: 9px 11px; border: 1px solid var(--bord); border-radius: 8px; background: #fff; min-width: 220px; }
  button { padding: 9px 14px; border-radius: 8px; border: 1px solid var(--violet); background: var(--violet); color: #fff; cursor: pointer; }
  button.fantome { background: #fff; color: var(--violet); }
  button.danger { background: #fff; color: #C0392B; border-color: #E4B4AE; }
  button:disabled { opacity: .5; cursor: default; }
  .onglets { display: flex; gap: 8px; margin: 26px 0 4px; }
  .onglets button { background: #fff; color: var(--gris); border-color: var(--bord); }
  .onglets button[aria-selected="true"] { background: var(--violet); color: #fff; border-color: var(--violet); }
  .etiq { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--bord); color: var(--gris); }
  .etiq.admin { border-color: var(--violet); color: var(--violet); }
  .etiq.banni { border-color: #E4B4AE; color: #C0392B; }
  .etiq.mineur { border-color: #E08A00; color: #B36B00; }
  .msg { padding: 11px 14px; border-radius: 8px; margin: 14px 0; font-size: 15px; }
  .msg.err { background: #FDECEA; color: #A5281B; }
  .msg.ok { background: #E9F7EF; color: #1E6B41; }
  td.actions { white-space: nowrap; }
  td.actions button { padding: 5px 9px; font-size: 13px; margin-right: 6px; }
  .vide { color: var(--gris); font-style: italic; padding: 18px 0; }
  .compte { color: var(--gris); font-size: 14px; }
</style>
</head>
<body>
<div class="page">
<header><a class="marque" href="/">boost<span>z</span></a></header>

<h1>Console</h1>
<p class="chapeau" id="chapeau">Réservée aux comptes administrateurs. C'est le serveur qui le
vérifie, pas cette page.</p>

<div id="ecranConnexion">
  <div class="barre">
    <input id="email" type="email" placeholder="Adresse e-mail" autocomplete="username">
    <input id="motdepasse" type="password" placeholder="Mot de passe" autocomplete="current-password">
    <button id="btnConnexion">Se connecter</button>
  </div>
  <div class="encadre">
    <p>La première ouverture peut prendre une trentaine de secondes : l'API dort après quinze
    minutes sans requête, et il faut la réveiller.</p>
  </div>
</div>

<div id="ecranConsole" hidden>
  <div class="barre">
    <span class="compte" id="qui"></span>
    <button class="fantome" id="btnRafraichir">Rafraîchir</button>
    <button class="fantome" id="btnDeconnexion">Se déconnecter</button>
  </div>

  <div class="onglets" role="tablist">
    <button role="tab" aria-selected="true" data-vue="utilisateurs">Utilisateurs</button>
    <button role="tab" aria-selected="false" data-vue="signalements">Signalements</button>
  </div>

  <div id="zone"></div>
</div>

<div id="message"></div>

<footer>
  <a href="/">Accueil</a>
  <a href="/confidentialite.html">Confidentialité</a>
</footer>
</div>

<script>
// L'adresse de l'API. En dur parce qu'il n'y en a qu'une, et qu'un champ de
// saisie pour l'URL d'un serveur est une invitation à se tromper de serveur.
const API = 'https://boostz-api.onrender.com';

// Le jeton vit dans sessionStorage et non localStorage : il disparaît à la
// fermeture de l'onglet. Une console d'administration ouverte sur un poste
// partagé ne doit pas rester connectée jusqu'à l'expiration du jeton, trente
// jours plus tard.
const CLE = 'boostz.console.jeton';
let jeton = sessionStorage.getItem(CLE) || null;
let vue = 'utilisateurs';
let donnees = { utilisateurs: [], signalements: [], adminCount: 0 };

const $ = (id) => document.getElementById(id);
const echapper = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
));

function dire(texte, type) {
  $('message').innerHTML = texte ? `<div class="msg ${type || 'ok'}">${echapper(texte)}</div>` : '';
}

async function appel(chemin, options) {
  const r = await fetch(API + chemin, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      ...(jeton ? { Authorization: 'Bearer ' + jeton } : {}),
      ...(options && options.headers)
    }
  });
  const corps = await r.json().catch(() => null);
  if (!r.ok) {
    // 401 et 403 sont deux choses différentes et méritent deux phrases : la
    // première dit "reconnecte-toi", la seconde dit "ce compte n'a pas le rôle".
    if (r.status === 401) { deconnecter(); throw new Error('Session expirée, reconnecte-toi.'); }
    if (r.status === 403) throw new Error("Ce compte n'est pas administrateur.");
    throw new Error((corps && corps.message) || ('Erreur ' + r.status));
  }
  return corps;
}

function deconnecter() {
  jeton = null;
  sessionStorage.removeItem(CLE);
  $('ecranConsole').hidden = true;
  $('ecranConnexion').hidden = false;
  $('zone').innerHTML = '';
}

async function connecter() {
  const email = $('email').value.trim();
  const motdepasse = $('motdepasse').value;
  if (!email || !motdepasse) return dire('Adresse et mot de passe requis.', 'err');
  $('btnConnexion').disabled = true;
  dire('Connexion… (le serveur peut mettre 30 s à se réveiller)');
  try {
    const r = await fetch(API + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: motdepasse })
    });
    const corps = await r.json().catch(() => null);
    if (!r.ok) throw new Error((corps && corps.message) || 'Identifiants incorrects.');
    // On refuse ici aussi, pour le dire tout de suite plutôt que de laisser
    // chaque appel suivant répondre 403 - mais c'est le serveur qui décide :
    // cette ligne est un confort, pas une sécurité.
    if (!corps.user || corps.user.role !== 'admin') throw new Error("Ce compte n'est pas administrateur.");
    jeton = corps.token;
    sessionStorage.setItem(CLE, jeton);
    $('motdepasse').value = '';
    $('qui').textContent = (corps.user.pseudo || corps.user.email) + ' · administrateur';
    $('ecranConnexion').hidden = true;
    $('ecranConsole').hidden = false;
    dire('');
    await charger();
  } catch (e) {
    dire(e.message, 'err');
  } finally {
    $('btnConnexion').disabled = false;
  }
}

async function charger() {
  dire('Chargement…');
  try {
    const [u, s] = await Promise.all([appel('/admin/users?limit=500'), appel('/admin/reports')]);
    donnees.utilisateurs = u.users || [];
    donnees.adminCount = u.admin_count || 0;
    donnees.signalements = s.reports || [];
    dire('');
    dessiner();
  } catch (e) {
    dire(e.message, 'err');
  }
}

function dateCourte(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

function dessinerUtilisateurs() {
  const lignes = donnees.utilisateurs.map((u) => {
    const etiquettes = [
      u.role === 'admin' ? '<span class="etiq admin">admin</span>' : '',
      u.banned_at ? '<span class="etiq banni">banni</span>' : '',
      u.is_adult ? '' : '<span class="etiq mineur">mineur</span>',
      u.deleted ? '<span class="etiq">supprimé</span>' : ''
    ].filter(Boolean).join(' ');

    const actions = u.deleted ? '—' : [
      u.banned_at
        ? `<button class="fantome" data-action="debannir" data-id="${u.id}">Débannir</button>`
        : `<button class="danger" data-action="bannir" data-id="${u.id}">Bannir</button>`,
      u.role === 'admin'
        ? `<button class="fantome" data-action="retrograder" data-id="${u.id}">Retirer admin</button>`
        : `<button class="fantome" data-action="promouvoir" data-id="${u.id}">Passer admin</button>`
    ].join('');

    return `<tr>
      <td><strong>${echapper(u.pseudo || '—')}</strong><br><span class="compte">${echapper(u.email)}</span></td>
      <td>${etiquettes || '—'}</td>
      <td>${u.reports_received || 0}</td>
      <td class="compte">${dateCourte(u.created_date)}</td>
      <td class="actions">${actions}</td>
    </tr>`;
  }).join('');

  return `<h2>Utilisateurs <span class="compte">· ${donnees.utilisateurs.length} comptes, ${donnees.adminCount} administrateur(s) actif(s)</span></h2>
    ${donnees.utilisateurs.length ? `<table>
      <thead><tr><th>Compte</th><th>État</th><th>Signalé</th><th>Inscrit le</th><th></th></tr></thead>
      <tbody>${lignes}</tbody></table>` : '<p class="vide">Aucun compte.</p>'}`;
}

function dessinerSignalements() {
  const lignes = donnees.signalements.map((r) => `<tr>
    <td><strong>${echapper(r.reported.pseudo || r.reported.id)}</strong>
      ${r.reported.banned_at ? '<span class="etiq banni">banni</span>' : ''}</td>
    <td>${echapper(r.reporter.pseudo || '—')}</td>
    <td>${echapper(r.reason)}<br><span class="compte">${echapper(r.description || '')}</span></td>
    <td><span class="etiq">${echapper(r.status)}</span></td>
    <td class="compte">${dateCourte(r.created_date)}</td>
    <td class="actions">${r.reported.banned_at
      ? `<button class="fantome" data-action="debannir" data-id="${r.reported.id}">Débannir</button>`
      : `<button class="danger" data-action="bannir" data-id="${r.reported.id}">Bannir</button>`}</td>
  </tr>`).join('');

  return `<h2>Signalements <span class="compte">· ${donnees.signalements.length}</span></h2>
    ${donnees.signalements.length ? `<table>
      <thead><tr><th>Signalé</th><th>Par</th><th>Motif</th><th>Statut</th><th>Le</th><th></th></tr></thead>
      <tbody>${lignes}</tbody></table>` : '<p class="vide">Aucun signalement. Bonne nouvelle.</p>'}`;
}

function dessiner() {
  $('zone').innerHTML = vue === 'utilisateurs' ? dessinerUtilisateurs() : dessinerSignalements();
}

async function agir(action, id) {
  const cible = donnees.utilisateurs.find((u) => u.id === id);
  const nom = (cible && (cible.pseudo || cible.email)) || id;
  try {
    if (action === 'bannir') {
      const raison = prompt(`Bannir ${nom} — motif (facultatif, gardé au dossier) :`);
      if (raison === null) return;
      await appel(`/admin/users/${id}/ban`, { method: 'POST', body: JSON.stringify({ reason: raison }) });
      dire(`${nom} est banni.`);
    } else if (action === 'debannir') {
      await appel(`/admin/users/${id}/unban`, { method: 'POST' });
      dire(`${nom} est débanni.`);
    } else if (action === 'promouvoir' || action === 'retrograder') {
      const role = action === 'promouvoir' ? 'admin' : 'user';
      if (!confirm(`Passer ${nom} en « ${role} » ?`)) return;
      await appel(`/admin/users/${id}/role`, { method: 'PATCH', body: JSON.stringify({ role }) });
      dire(`${nom} est maintenant « ${role} ».`);
    }
    await charger();
  } catch (e) {
    // Les refus du serveur - dernier administrateur, auto-bannissement - passent
    // par ici et sont écrits pour être lus tels quels.
    dire(e.message, 'err');
  }
}

$('btnConnexion').addEventListener('click', connecter);
$('motdepasse').addEventListener('keydown', (e) => { if (e.key === 'Enter') connecter(); });
$('btnRafraichir').addEventListener('click', charger);
$('btnDeconnexion').addEventListener('click', () => { deconnecter(); dire('Déconnecté.'); });
$('zone').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-action]');
  if (b) agir(b.dataset.action, b.dataset.id);
});
document.querySelectorAll('.onglets button').forEach((b) => {
  b.addEventListener('click', () => {
    vue = b.dataset.vue;
    document.querySelectorAll('.onglets button').forEach((x) => x.setAttribute('aria-selected', String(x === b)));
    dessiner();
  });
});

// Un jeton déjà en session : on reprend sans redemander le mot de passe.
if (jeton) {
  $('ecranConnexion').hidden = true;
  $('ecranConsole').hidden = false;
  charger();
}
</script>
</body>
</html>
