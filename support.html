<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Aucun script en ligne : la CSP n'admet que les fichiers du site (voir assets/api.js). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http://localhost:3001; font-src 'self'; connect-src 'self' https://boostz-api.onrender.com http://localhost:3001; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#08070B">
<title>Contacter le support — boostZ</title>
<meta name="description" content="Ouvre une demande au support boostZ et suis les réponses.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/site.css">
<style>
  .tk-list { display: flex; flex-direction: column; gap: 7px; margin-top: 12px; }
  .tk-item { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; width: 100%; text-align: left; cursor: pointer;
    border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 11px 13px; background: transparent; color: var(--text); transition: border-color .2s, background-color .2s; }
  .tk-item:hover { border-color: rgba(255,255,255,.22); }
  .tk-item[aria-current="true"] { border-color: var(--soft-violet-border); background: var(--soft-violet-fill); }
  .tk-subject { font-family: var(--font-ui); font-weight: 700; font-size: 12.5px; flex: 1; min-width: 150px; overflow-wrap: anywhere; }
  .tk-date { font-size: 11px; color: var(--text-disabled); white-space: nowrap; }
  .fiche { border: 1px solid rgba(255,255,255,.08); border-radius: 13px; background: rgba(8,6,14,.45); padding: 12px 14px; }
  .fiche p { margin: 6px 0 0; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .two { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; margin-top: 22px; }
  .two > .left { flex: 1 1 360px; min-width: 0; }
  .two > .right { flex: 1 1 340px; min-width: 0; }
  .tk-back { display: none; align-items: center; gap: 10px; padding: 0; margin: 0 0 10px;
    border: 0; background: transparent; color: var(--text); cursor: pointer; font-family: var(--font-ui); font-weight: 700; font-size: 13.5px; }
  .tk-back span { width: 30px; height: 30px; border-radius: 10px; border: 1px solid var(--line-strong); display: inline-flex; align-items: center; justify-content: center; font-size: 20px; line-height: 1; padding-bottom: 2px; color: var(--text-muted); }

  /* Écran étroit : une colonne. Les demandes en cours passent avant le formulaire,
     et ouvrir une demande affiche sa conversation seule, avec un retour à la liste
     (classe is-reading posée par openTicket), au lieu de l'empiler dessous. */
  @media (max-width: 760px) {
    .two { flex-direction: column; align-items: stretch; gap: 10px; margin-top: 14px; }
    .two > .left, .two > .right { flex: none; width: 100%; }
    main.has-tickets .two > .right { order: -1; }
    main.is-reading .two > .left, main.is-reading #mine-title, main.is-reading .tk-listhost, main.is-reading .tk-sep, main.is-reading .bz-lead { display: none; }
    main.is-reading .tk-back { display: inline-flex; }
    main:not(.is-reading) .tk-sep, main:not(.is-reading) .tk-threadhost { display: none; }
    .tk-list { gap: 6px; margin-top: 10px; }
    .tk-item { padding: 11px 12px; gap: 4px 8px; border-radius: 13px; }
    .tk-subject { font-size: 13.5px; min-width: 0; flex-basis: calc(100% - 100px); }
    .tk-date { font-size: 11px; }
    .fiche { padding: 11px 12px; border-radius: 13px; }
    .fiche p { font-size: 13px; }
    .fiche .bz-eyebrow { font-size: 10.5px; }
  }
</style>
</head>
<body>
<div id="top"></div>
<main id="main" class="bz-page">
  <div class="bz-skeleton" style="height:40px;max-width:360px"></div>
</main>

<script type="module" src="assets/page-support.js"></script>
</body>
</html>
