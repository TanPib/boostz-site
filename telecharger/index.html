<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B0812">
<title>Installer Boostz sur Android</title>
<meta name="robots" content="noindex">
<!-- QUI ARRIVE ICI : les téléphones installés par APK. Leur appli ne reçoit
     plus les mises à jour (elles partent vers la version du Play Store) et
     affiche « Installe la nouvelle version de Boostz », dont le bouton ouvre
     cette adresse (boostz-mobile, lib/reinstall.js, DOWNLOAD_PAGE_URL) :
     l'adresse ne doit donc jamais changer. L'avis ne s'affiche que si
     /assets/app-latest.json annonce une empreinte différente de celle du
     téléphone ; ce fichier s'écrit à la main, à chaque build du Play Store
     qui change l'empreinte.

     TANT QUE BOOSTZ EST EN BÊTA, cette page renvoie à /beta/ : ses trois
     étapes (groupe des testeurs, invitation, installation) valent aussi pour
     qui a déjà l'appli, et Google Play la met à jour par-dessus. À LA SORTIE,
     la renvoyer vers la fiche du Play Store. Pas de script : un renvoi
     immédiat, et le lien en clair si le navigateur ne le suit pas. -->
<meta http-equiv="refresh" content="0; url=/beta/">
<link rel="canonical" href="https://boostz.fr/beta/">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/vitrine.css">
</head>
<body>
<div class="pg" style="min-height:100vh">
<main class="in" style="padding-top:64px;text-align:center">
  <h1 class="h t4">La nouvelle version de Boostz<br><span class="acc">s'installe depuis Google Play</span></h1>
  <p class="p">Si la page ne s'ouvre pas toute seule&nbsp;: <a href="/beta/">continue ici</a>.</p>
</main>
</div>
</body>
</html>
