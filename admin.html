<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#08070B">
<title>Administration — boostZ</title>
<!-- Jamais indexée. Publique au sens où GitHub Pages sert tout ce qu'il héberge,
     mais tout ce qu'on y voit vient de l'API, qui ne répond qu'à un compte admin.
     Le noindex ne protège rien : il évite de mettre une porte en vitrine. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/site.css">
<style>
  body { background-image:
    radial-gradient(900px 600px at 12% -8%, rgba(139,61,255,.14), transparent 62%),
    linear-gradient(158deg, #08070B, #0F0A17 45%, #130D1E); }
  .adm-kpis { grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); gap: 10px; }
  #toast { position: sticky; top: 64px; z-index: 50; margin-top: 12px; }
  #toast:empty { display: none; }
  .adm-split { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; margin-top: 16px; }
  .adm-list-card { flex: 1 1 420px; min-width: 0; padding: 0; overflow: hidden; }
  .adm-detail { flex: 1 1 380px; min-width: 0; position: sticky; top: 76px; }
  @media (max-width: 860px) { .adm-detail { position: static; } }
  .adm-list-head { padding: 13px 16px; border-bottom: 1px solid var(--line); font-family: var(--font-ui); font-weight: 700; font-size: 12px; color: var(--text-muted); }
  .adm-list { max-height: 640px; overflow-y: auto; }
  .adm-item { display: block; width: 100%; text-align: left; cursor: pointer; background: transparent; color: var(--text);
    border: 0; border-bottom: 1px solid rgba(255,255,255,.05); border-left: 3px solid transparent; padding: 12px 16px; transition: background-color .2s; }
  .adm-item:hover { background: rgba(255,255,255,.03); }
  .adm-item[aria-current="true"] { background: rgba(139,61,255,.12); border-left-color: var(--brand-violet); }
  .adm-date { margin-left: auto; font-size: 11px; color: var(--text-disabled); white-space: nowrap; }
  .adm-line { display: flex; gap: 10px; font-size: 12.5px; }
  .adm-line > span { width: 92px; flex: none; }
  .adm-line > b { font-family: var(--font-ui); font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
  .adm-quote { margin-top: 14px; border: 1px solid rgba(255,255,255,.08); border-radius: 13px; background: rgba(8,6,14,.5); padding: 12px 14px; }
  .adm-quote p { margin: 7px 0 0; font-size: 13px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
  .adm-quote.is-red { border-left: 3px solid var(--soft-red-border); background: var(--soft-red-fill); border-radius: 0 13px 13px 0; }
  .adm-thread { margin-top: 14px; max-height: 420px; overflow-y: auto; padding-right: 4px; }
  .adm-kpi-value { font-family: var(--font-display); font-weight: 700; font-size: 22px; margin-top: 3px; }
  /* Le retour de l'app : un carré de 30 à coins de 10, puis le libellé. */
  .adm-back {
    display: inline-flex; align-items: center; gap: 10px; padding: 0; margin: 2px 0 6px;
    border: 0; background: transparent; color: var(--text); cursor: pointer;
    font-family: var(--font-ui); font-weight: 700; font-size: 13.5px;
  }
  .adm-back span { width: 30px; height: 30px; border-radius: 10px; border: 1px solid var(--line-strong); display: inline-flex; align-items: center; justify-content: center; font-size: 20px; line-height: 1; padding-bottom: 2px; color: var(--text-muted); }
  .adm-back:hover span { border-color: rgba(255,255,255,.3); color: var(--text); }

  /* ---------- Analyse automatique (encart d'un ticket, détail de la vue Agent) ---------- */
  .adm-ai { margin-top: 14px; border: 1px solid rgba(217,196,251,.55); border-radius: 14px; background: rgba(139,61,255,.07); overflow: hidden; }
  .adm-ai.is-red { border-color: rgba(243,196,196,.6); background: rgba(255,107,107,.06); }
  .adm-ai.is-grey { border-color: var(--line-strong); background: rgba(255,255,255,.03); }
  .adm-ai-sum { display: flex; align-items: center; gap: 8px; padding: 10px 12px; cursor: pointer; list-style: none; font-family: var(--font-ui); font-size: 13px; }
  .adm-ai-sum::-webkit-details-marker { display: none; }
  .adm-ai-icon { display: inline-flex; color: var(--soft-violet-text); }
  .adm-ai.is-red .adm-ai-icon { color: var(--text-danger); }
  .adm-ai.is-grey .adm-ai-icon { color: var(--text-muted); }
  .adm-ai-caret { margin-left: auto; display: inline-flex; color: var(--text-muted); transition: transform .2s; }
  .adm-ai[open] > .adm-ai-sum .adm-ai-caret { transform: rotate(180deg); }
  .adm-ai-body { display: flex; flex-direction: column; gap: 10px; padding: 0 12px 12px; }
  .adm-ai-headline { margin: 0; font-family: var(--font-ui); font-weight: 700; font-size: 13px; color: var(--text); }
  .adm-ai-answer { margin: 0; padding: 10px 12px; border-left: 3px solid var(--soft-violet-border); border-radius: 0 10px 10px 0; background: rgba(8,6,14,.45); }
  .adm-ai-answer p, .adm-ai-note p { margin: 5px 0 0; font-size: 13px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
  /* La note de l'agent est ce qui fait gagner du temps : elle ressort. */
  .adm-ai-note { padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(245,166,35,.5); background: rgba(245,166,35,.1); }
  .adm-ai-note .bz-eyebrow { color: #F8C46A; }
  .adm-ai-chips { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 0; padding: 0; }
  .adm-ai-chips li { max-width: 100%; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line-strong); background: rgba(255,255,255,.04); font-size: 12px; overflow-wrap: anywhere; }
  .adm-ai-chips code { font-size: 11.5px; color: var(--text-muted); }
  .adm-ai-more { padding-top: 8px; border-top: 1px solid var(--line); }
  .adm-ai-more > summary { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; list-style: none; font-family: var(--font-ui); font-weight: 700; font-size: 12px; color: var(--text-muted); }
  .adm-ai-more > summary::-webkit-details-marker { display: none; }
  .adm-ai-more > summary svg { transform: rotate(-90deg); transition: transform .2s; }
  .adm-ai-more[open] > summary svg { transform: none; }
  .adm-ai-more-body { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .adm-ai-facts { margin: 0; padding-left: 18px; font-size: 12.5px; line-height: 1.5; }
  .adm-ai-facts li { overflow-wrap: anywhere; }
  .adm-ai-tech { margin: 4px 0 0; }

  /* ---------- Vue Agent ---------- */
  .adm-agent { margin-top: 16px; }
  .adm-agent-kpis { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); margin-top: 12px; }
  .adm-kpi-sub { display: block; margin-top: 1px; font-size: 11px; color: var(--text-muted); }
  .adm-agent-alert { margin-top: 12px; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--soft-red-border); background: var(--soft-red-fill); }
  .adm-agent-alert > b { font-family: var(--font-ui); font-size: 13px; color: var(--soft-red-text); }
  .adm-agent-alert ul { list-style: none; display: flex; flex-direction: column; gap: 7px; margin: 8px 0 0; padding: 0; }
  .adm-agent-alert li { display: flex; align-items: baseline; gap: 10px; font-size: 13px; }
  .adm-agent-alert li small { display: block; font-size: 12px; color: var(--text-muted); }
  .adm-agent-alert-count { flex: none; min-width: 34px; font-family: var(--font-display); font-weight: 700; color: var(--soft-red-text); }
  .adm-agent-alert li.is-urgent b { color: #FFB4C0; }
  .adm-agent-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); margin-top: 12px; }
  .adm-agent-card { padding: 0; overflow: hidden; }
  .adm-agent-zones, .adm-agent-top { list-style: none; margin: 0; padding: 4px 16px 8px; }
  .adm-agent-zones li { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
  .adm-agent-zones li:last-child, .adm-agent-top li:last-child { border-bottom: 0; }
  .adm-agent-zone-top { display: flex; align-items: baseline; gap: 10px; font-size: 12.5px; }
  .adm-agent-zone-top b { flex: 1; min-width: 0; font-family: var(--font-ui); }
  .adm-agent-zone-top span { white-space: nowrap; color: var(--text-muted); }
  .adm-agent-bar { display: flex; height: 6px; margin: 6px 0 3px; border-radius: 6px; background: rgba(255,255,255,.07); overflow: hidden; }
  .adm-agent-bar .is-ticket { background: #7431E0; }
  .adm-agent-bar .is-regle { background: var(--fill-success); }
  .adm-agent-foot { margin: 0; padding: 0 16px 12px; }
  .adm-agent-top { counter-reset: top; }
  .adm-agent-top li { display: flex; align-items: baseline; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.05); font-size: 12.5px; counter-increment: top; }
  .adm-agent-top li::before { content: counter(top); min-width: 16px; font-family: var(--font-display); font-weight: 700; color: var(--text-muted); }
  .adm-agent-top li > :first-child { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .adm-agent-top code { font-size: 12px; color: var(--text-muted); }
  .adm-agent-title { margin: 22px 0 8px; }
  .adm-agent-empty { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 12px; padding: 34px 22px; text-align: center; }
  .adm-agent-empty-icon { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--soft-violet-border); background: var(--soft-violet-fill); color: var(--soft-violet-text); }
  .adm-agent-empty p { max-width: 460px; margin: 0; }
  .adm-agent-ticket { gap: 8px; margin-top: 10px; }

  /* Écran étroit : liste OU détail (admin.js), sans défilement dans le défilement. */
  @media (max-width: 860px) {
    .adm-split { flex-direction: column; align-items: stretch; gap: 8px; }
    .adm-list-card, .adm-detail { flex: none; width: 100%; }
    .adm-list, .adm-thread { max-height: none; overflow: visible; }
  }

  @media (max-width: 640px) {
    /* Les quatre chiffres clés en une rangée compacte. */
    .adm-kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    .adm-kpi { padding: 8px 6px 7px; border-radius: 12px; text-align: center; }
    .adm-kpi .bz-eyebrow { font-size: 9px; letter-spacing: .05em; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .adm-kpi-value { font-size: 17px; margin-top: 0; }
    .bz-tabs[aria-label="Sections de la console"] { margin-top: 12px !important; }
    .adm-split { margin-top: 10px !important; }
    .bz-page > #main > section.bz-card { margin-top: 10px !important; }

    /* Le retour d'une action : en bas, au-dessus du pouce. */
    #toast { position: fixed; top: auto; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 70; margin: 0; }
    #toast .bz-msg { box-shadow: 0 12px 32px rgba(0,0,0,.5); background-color: #1E1729; }

    .adm-users-bar { gap: 8px; padding: 10px 12px !important; }
    .adm-users-bar input[type="search"] { flex: 1 1 100% !important; min-width: 0 !important; }
    .adm-users-bar .bz-filter-btn { flex: 1; justify-content: space-between; }
    .adm-count { width: 100%; font-size: 11.5px; }

    .adm-list-head { padding: 10px 14px; font-size: 11.5px; }
    .adm-item { padding: 11px 14px; }
    .adm-item b { font-size: 13.5px !important; }
    .adm-item .bz-small { font-size: 11.5px; margin-top: 3px !important; }
    .adm-date { font-size: 10.5px; }
    .adm-detail b[style*="font-display"] { font-size: 15px !important; }
    .adm-line { font-size: 12.5px; gap: 8px; }
    .adm-line > span { width: 76px; font-size: 11.5px; }
    .adm-quote { padding: 10px 12px; margin-top: 12px; border-radius: 12px; }
    .adm-quote p { font-size: 13px; }
    .adm-actions { display: grid !important; grid-template-columns: 1fr 1fr; }
    .adm-actions .bz-btn { width: 100%; }
    .adm-status { display: grid !important; grid-template-columns: 1fr 1fr; gap: 6px !important; }
    .adm-status:not(:has(.bz-tiny)) { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .adm-status .bz-tiny { grid-column: 1 / -1; }
    .adm-status .bz-btn { width: 100%; }
    .adm-split:has(> .adm-phead) { margin-top: 0 !important; }
    .adm-detail > .bz-stack:first-child { margin-top: 0 !important; }

    /* ---------- En-tête : nom de la section à côté du logo ---------- */
    .bz-top-title { font-family: var(--font-display); font-weight: 700; font-size: 15px; line-height: 18px; color: var(--text); padding-left: 10px; border-left: 1px solid var(--line-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

    /* ---------- Barre d'onglets du bas ---------- */
    body.adm-with-nav .bz-page { padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
    body.adm-with-composer .bz-page { padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
    body.adm-with-nav #toast, body.adm-with-composer #toast { bottom: calc(72px + env(safe-area-inset-bottom)); }
    .adm-nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 65; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
      padding: 6px max(6px, env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
      background: rgba(12,9,18,.93); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid rgba(255,255,255,.07);
    }
    .adm-nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 2px 0; border: 0; background: transparent; cursor: pointer;
      color: rgba(255,255,255,.5); font-family: var(--font-ui); font-weight: 700; font-size: 10.5px; -webkit-tap-highlight-color: transparent;
    }
    /* L'onglet actif doit se voir d'un coup d'œil, même écran baissé ou en plein
       soleil : pastille violette pleine, icône blanche, libellé clair. Le violet
       à 16 % d'avant disparaissait sur le fond presque noir de la barre. */
    .adm-nav-item[aria-current="page"] { color: #fff; }
    .adm-nav-label { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @media (max-width: 360px) { .adm-nav-label { font-size: 9.5px; } .adm-nav-icon { width: 46px; } }
    .adm-nav-item[aria-current="page"] .adm-nav-label { color: #E4D7FF; }
    .adm-nav-icon { position: relative; display: flex; align-items: center; justify-content: center; width: 56px; height: 30px; border-radius: 999px; transition: background-color .2s, box-shadow .2s; }
    .adm-nav-item[aria-current="page"] .adm-nav-icon { background: #7431E0; box-shadow: 0 4px 14px rgba(116,49,224,.45), inset 0 0 0 1px rgba(196,181,253,.35); }
    .adm-nav-badge {
      position: absolute; top: -3px; right: 6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px;
      background: var(--brand-rose); color: #fff; font-size: 9.5px; line-height: 16px; text-align: center; box-shadow: 0 0 0 2px #0C0912;
    }

    /* Chiffres clés : des raccourcis. */
    button.adm-kpi { font: inherit; color: inherit; width: 100%; cursor: pointer; }
    button.adm-kpi:active { background: rgba(255,255,255,.07); }

    /* ---------- Comptes : recherche, filtre, lignes ---------- */
    .adm-users-phone { margin-top: 10px; }
    .adm-toolbar { display: flex; align-items: center; gap: 8px; }
    .adm-toolbar input[type="search"] { flex: 1; }
    .adm-filter-icon {
      position: relative; flex: none; width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center;
      border-radius: 12px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.05); color: var(--text-muted); cursor: pointer;
    }
    .adm-filter-icon[aria-expanded="true"] { border-color: var(--brand-violet); color: var(--text); }
    .adm-filter-dot { position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--brand-rose); }
    .adm-count { margin: 8px 2px 6px; font-size: 11.5px; color: var(--text-muted); }
    .adm-ulist { padding: 0; overflow: hidden; }
    .adm-urow { display: flex; align-items: center; gap: 10px; width: 100%; padding-block: 9px; text-align: left; border: 0; border-bottom: 1px solid rgba(255,255,255,.06); background: transparent; color: var(--text); font: inherit; line-height: 1.3; cursor: pointer; }
    .adm-urow .bz-pill { padding-block: 1px; }
    .adm-urow .bz-avatar { width: 34px; height: 34px; font-size: 13px; }
    .adm-urow-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .adm-urow-top { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .adm-urow-top b { font-family: var(--font-ui); font-size: 13.5px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .adm-urow-top .bz-cardrow-pills { margin: 0; flex: none; flex-wrap: nowrap; gap: 4px; }
    .adm-urow-mail, .adm-urow-meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .adm-urow-mail { font-size: 11.5px; color: var(--text-muted); }
    .adm-urow-meta { font-size: 11px; color: var(--text-disabled); }
    .adm-urow-meta.is-alert { color: var(--text-danger); }
    .adm-urow-chev { flex: none; display: flex; color: var(--text-disabled); }

    /* Fiche d'un compte (panneau du bas). */
    .adm-usheet .bz-menu-account { align-items: flex-start; }
    .adm-usheet-pills { justify-content: flex-end; max-width: 42%; margin: 2px 0 0 !important; }
    .adm-usheet-dl { margin: 12px 8px 4px !important; }
    .adm-usheet-label { margin-top: 10px; padding: 10px 12px 2px; border-top: 1px solid var(--line); font-family: var(--font-ui); font-weight: 700; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-disabled); }

    /* ---------- En-tête d'un détail ---------- */
    .adm-phead {
      position: sticky; top: 52px; z-index: 20; display: flex; align-items: center; gap: 10px;
      margin: -16px -16px 10px; padding: 9px 16px; background: rgba(10,8,14,.92); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .adm-back.is-square { flex: none; width: 32px; height: 32px; margin: 0; justify-content: center; border-radius: 10px; border: 1px solid var(--line-strong); color: var(--text); }
    .adm-phead-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .adm-phead-text b { font-family: var(--font-display); font-size: 14.5px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .adm-phead-text span { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* Analyse automatique et vue Agent. */
    .adm-ai-sum { padding: 9px 11px; }
    .adm-ai-body { padding: 0 11px 11px; }
    .adm-chat .adm-ai { margin: 0 0 10px; }
    .adm-agent { margin-top: 4px; }
    .adm-agent:has(> .adm-phead) { margin-top: 0; }
    .adm-agent-kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
    .adm-kpi-sub { font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .adm-ai-sum { flex-wrap: wrap; row-gap: 4px; }
    .adm-ai-sum b { white-space: nowrap; }
    .adm-agent-alert { padding: 10px 12px; }
    .adm-agent-alert li { font-size: 12.5px; }
    .adm-agent-alert li small { font-size: 11.5px; }
    .adm-agent-grid { gap: 10px; margin-top: 10px; }
    .adm-agent-zones, .adm-agent-top { padding-inline: 14px; }
    .adm-agent-foot { padding-inline: 14px; }
    .adm-agent-title { margin: 18px 0 8px; }
    .adm-agent-empty { padding: 26px 18px; }

    .adm-status-btn { position: relative; flex: none; display: inline-flex; padding: 0; border: 0; background: transparent; cursor: pointer; }
    /* La pastille fait 22 px : sa zone de toucher, elle, en fait 44. */
    .adm-status-btn::after { content: ''; position: absolute; inset: -11px -6px; }
    .adm-status-btn .bz-pill::after { content: ''; width: 0; height: 0; margin-left: 2px; border-left: 3.5px solid transparent; border-right: 3.5px solid transparent; border-top: 4px solid currentColor; }

    /* ---------- Support : messagerie ---------- */
    .adm-chat-fiche { margin-top: 0; }
    .adm-chat .adm-thread { margin-top: 12px; }
    .adm-composer {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 65; display: flex; align-items: flex-end; gap: 8px;
      padding: 8px max(12px, env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      background: rgba(12,9,18,.94); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid rgba(255,255,255,.07);
    }
    .adm-composer-input {
      flex: 1; min-height: 40px; max-height: 120px; resize: none; padding: 10px 14px; border-radius: 20px; outline: none;
      border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.05); color: var(--text); font-family: var(--font-body); font-size: 14px; line-height: 1.35;
    }
    .adm-composer-input:focus { border-color: var(--brand-violet); }
    .adm-send { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; display: inline-flex; align-items: center; justify-content: center; background: #7431E0; color: #fff; cursor: pointer; transition: background-color .15s; }
    .adm-send:disabled { background: rgba(255,255,255,.08); color: var(--text-disabled); cursor: default; }

    /* ---------- Journal : lignes ---------- */
