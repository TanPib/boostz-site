<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08070B">
<title>Administration — boostZ</title>
<!-- Jamais indexée. Publique au sens où GitHub Pages sert tout ce qu'il héberge,
     mais tout ce qu'on y voit vient de l'API, qui ne répond qu'à un compte admin.
     Le noindex ne protège rien : il évite de mettre une porte en vitrine. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/site.css">
<style>
  body { background-image:
    radial-gradient(900px 600px at 12% -8%, rgba(139,61,255,.14), transparent 62%),
    linear-gradient(158deg, #08070B, #0F0A17 45%, #130D1E); }
  .adm-kpis { grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); gap: 10px; }
  #toast { position: sticky; top: 64px; z-index: 50; margin-top: 12px; }
  #toast:empty { display: none; }
  .adm-split { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; margin-top: 16px; }
  .adm-list-card { flex: 1 1 420px; min-width: 0; padding: 0; overflow: hidden; }
  .adm-detail { flex: 1 1 380px; min-width: 0; position: sticky; top: 76px; }
  @media (max-width: 860px) { .adm-detail { position: static; } }
  .adm-list-head { padding: 13px 16px; border-bottom: 1px solid var(--line); font-family: var(--font-ui); font-weight: 700; font-size: 12px; color: var(--text-muted); }
  .adm-list { max-height: 640px; overflow-y: auto; }
  .adm-item { display: block; width: 100%; text-align: left; cursor: pointer; background: transparent; color: var(--text);
    border: 0; border-bottom: 1px solid rgba(255,255,255,.05); border-left: 3px solid transparent; padding: 12px 16px; transition: background-color .2s; }
  .adm-item:hover { background: rgba(255,255,255,.03); }
  .adm-item[aria-current="true"] { background: rgba(139,61,255,.12); border-left-color: var(--brand-violet); }
  .adm-date { margin-left: auto; font-size: 11px; color: var(--text-disabled); white-space: nowrap; }
  .adm-line { display: flex; gap: 10px; font-size: 12.5px; }
  .adm-line > span { width: 92px; flex: none; }
  .adm-line > b { font-family: var(--font-ui); font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
  .adm-quote { margin-top: 14px; border: 1px solid rgba(255,255,255,.08); border-radius: 13px; background: rgba(8,6,14,.5); padding: 12px 14px; }
  .adm-quote p { margin: 7px 0 0; font-size: 13px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
  .adm-quote.is-red { border-left: 3px solid var(--soft-red-border); background: var(--soft-red-fill); border-radius: 0 13px 13px 0; }
  .adm-thread { margin-top: 14px; max-height: 420px; overflow-y: auto; padding-right: 4px; }
  .adm-kpi-value { font-family: var(--font-display); font-weight: 700; font-size: 22px; margin-top: 3px; }
  /* Le retour de l'app : un carré de 30 à coins de 10, puis le libellé. */
  .adm-back {
    display: inline-flex; align-items: center; gap: 10px; padding: 0; margin: 2px 0 6px;
    border: 0; background: transparent; color: var(--text); cursor: pointer;
    font-family: var(--font-ui); font-weight: 700; font-size: 13.5px;
  }
  .adm-back span { width: 30px; height: 30px; border-radius: 10px; border: 1px solid var(--line-strong); display: inline-flex; align-items: center; justify-content: center; font-size: 20px; line-height: 1; padding-bottom: 2px; color: var(--text-muted); }
  .adm-back:hover span { border-color: rgba(255,255,255,.3); color: var(--text); }

  /* Écran étroit : liste OU détail (admin.js), sans défilement dans le défilement. */
  @media (max-width: 860px) {
    .adm-split { flex-direction: column; align-items: stretch; gap: 8px; }
    .adm-list-card, .adm-detail { flex: none; width: 100%; }
    .adm-list, .adm-thread { max-height: none; overflow: visible; }
  }

  @media (max-width: 640px) {
    /* Les quatre chiffres clés en une rangée compacte. */
    .adm-kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    .adm-kpi { padding: 8px 6px 7px; border-radius: 12px; text-align: center; }
    .adm-kpi .bz-eyebrow { font-size: 9px; letter-spacing: .05em; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .adm-kpi-value { font-size: 17px; margin-top: 0; }
    .bz-tabs[aria-label="Sections de la console"] { margin-top: 12px !important; }
    .adm-split { margin-top: 10px !important; }
    .bz-page > #main > section.bz-card { margin-top: 10px !important; }

    /* Le retour d'une action : en bas, au-dessus du pouce. */
    #toast { position: fixed; top: auto; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 70; margin: 0; }
    #toast .bz-msg { box-shadow: 0 12px 32px rgba(0,0,0,.5); background-color: #1E1729; }

    .adm-users-bar { gap: 8px; padding: 10px 12px !important; }
    .adm-users-bar input[type="search"] { flex: 1 1 100% !important; min-width: 0 !important; }
    .adm-users-bar .bz-filter-btn { flex: 1; justify-content: space-between; }
    .adm-count { width: 100%; font-size: 11.5px; }

    .adm-list-head { padding: 10px 14px; font-size: 11.5px; }
    .adm-item { padding: 11px 14px; }
    .adm-item b { font-size: 13.5px !important; }
    .adm-item .bz-small { font-size: 11.5px; margin-top: 3px !important; }
    .adm-date { font-size: 10.5px; }
    .adm-detail b[style*="font-display"] { font-size: 15px !important; }
    .adm-line { font-size: 12.5px; gap: 8px; }
    .adm-line > span { width: 76px; font-size: 11.5px; }
    .adm-quote { padding: 10px 12px; margin-top: 12px; border-radius: 12px; }
    .adm-quote p { font-size: 13px; }
    .adm-actions { display: grid !important; grid-template-columns: 1fr 1fr; }
    .adm-actions .bz-btn { width: 100%; }
    .adm-status { display: grid !important; grid-template-columns: 1fr 1fr; gap: 6px !important; }
    .adm-status:not(:has(.bz-tiny)) { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .adm-status .bz-tiny { grid-column: 1 / -1; }
    .adm-status .bz-btn { width: 100%; }
  }
</style>
</head>
<body>
<div id="top"></div>
<main class="bz-page is-wide">
  <div id="toast" aria-live="polite"></div>
  <div id="main">
    <div class="bz-grid adm-kpis" aria-hidden="true">
      <div class="bz-skeleton" style="height:70px"></div><div class="bz-skeleton" style="height:70px"></div>
      <div class="bz-skeleton" style="height:70px"></div><div class="bz-skeleton" style="height:70px"></div>
    </div>
  </div>
</main>
<script type="module">
import { start } from './assets/admin.js';
start();
</script>
</body>
</html>
